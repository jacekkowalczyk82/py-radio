# MQTT alternative to AWS SQS and RabbitMQ
[default]
radio.default-station = http://31.192.216.5/rmf_fm
radio.default-volume = 100

[mqtt]
radio.control.queue.provider = mqtt
radio.control.queue.name = test/radio-control
radio.mqtt.host = localhost
radio.mqtt.port = 1883
radio.mqtt.keepalive = 60
radio.mqtt.topic = test/radio-control
radio.mqtt.qos = 1
; radio.mqtt.user =
; radio.mqtt.password =

# Copy this file to ~/.config/py-radio/config.ini to use MQTT.
